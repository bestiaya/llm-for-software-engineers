<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 982 306" role="img" aria-labelledby="dp-title dp-desc">
  <title id="dp-title">一条样本和一列权重怎样做点积</title>
  <desc id="dp-desc">类别零的计算中，通道 A 的输入二乘权重零点五得到一，通道 B 的输入一乘权重负一得到负一。将两个乘积相加得到点积零，再加类别零的偏置零后得到分数零。</desc>
  <defs>
    <marker id="dp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#426176"/>
    </marker>
    <style>
      .dp-main{font:700 22px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .dp-head{font:650 17px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .dp-copy{font:15px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#39566a}
      .dp-value{font:700 21px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .dp-link{fill:none;stroke:#426176;stroke-width:2;marker-end:url(#dp-arrow)}
    </style>
  </defs>
  <rect width="982" height="306" rx="16" fill="#f4f8fa"/>
  <text x="28" y="43" class="dp-main">先按通道配对，再加总乘积</text>
  <text x="28" y="68" class="dp-copy">以一条样本和类别 0 的权重为例</text>

  <g stroke-width="1.5">
    <rect x="28" y="99" width="272" height="76" rx="12" fill="#eaf1fb" stroke="#a5bce0"/>
    <rect x="28" y="198" width="272" height="76" rx="12" fill="#fff6e8" stroke="#dec19b"/>
    <rect x="370" y="99" width="152" height="76" rx="12" fill="#fff" stroke="#beced7"/>
    <rect x="370" y="198" width="152" height="76" rx="12" fill="#fff" stroke="#beced7"/>
    <rect x="610" y="148" width="135" height="76" rx="12" fill="#e6f5f3" stroke="#8fc3bd"/>
    <rect x="817" y="148" width="137" height="76" rx="12" fill="#e6f5f3" stroke="#8fc3bd"/>
  </g>
  <g text-anchor="middle">
    <text x="164" y="129" class="dp-head">通道 A</text>
    <text x="164" y="154" class="dp-copy">输入 2　×　相应权重 0.5</text>
    <text x="164" y="228" class="dp-head">通道 B</text>
    <text x="164" y="253" class="dp-copy">输入 1　×　相应权重 −1</text>

    <text x="446" y="128" class="dp-copy">A 的乘积</text>
    <text x="446" y="156" class="dp-value">1</text>
    <text x="446" y="227" class="dp-copy">B 的乘积</text>
    <text x="446" y="255" class="dp-value">−1</text>

    <text x="677" y="177" class="dp-copy">点积</text>
    <text x="677" y="205" class="dp-value">0</text>
    <text x="885" y="177" class="dp-copy">类别 0 分数</text>
    <text x="885" y="205" class="dp-value">0</text>
    <text x="576" y="177" class="dp-copy">相加</text>
    <text x="781" y="175" class="dp-copy">加偏置 0</text>
  </g>
  <path d="M300 137H367" class="dp-link"/>
  <path d="M300 236H367" class="dp-link"/>
  <path d="M522 137H555V186H607" class="dp-link"/>
  <path d="M522 236H555V186" fill="none" stroke="#426176" stroke-width="2"/>
  <path d="M745 186H814" class="dp-link"/>
</svg>
