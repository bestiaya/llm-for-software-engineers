  <text class="lc-label" x="814" y="316.6">验证 0.413</text>
  <text class="lc-label" x="814" y="390.4">训练 0.009</text>
  <text class="lc-tick" x="110.0" y="414" text-anchor="middle">0</text><text class="lc-tick" x="172.7" y="414" text-anchor="middle">1</text><text class="lc-tick" x="235.5" y="414" text-anchor="middle">2</text><text class="lc-tick" x="298.2" y="414" text-anchor="middle">5</text><text class="lc-tick" x="360.9" y="414" text-anchor="middle">10</text><text class="lc-tick" x="423.6" y="414" text-anchor="middle">20</text><text class="lc-tick" x="486.4" y="414" text-anchor="middle">50</text><text class="lc-tick" x="549.1" y="414" text-anchor="middle">100</text><text class="lc-tick" x="611.8" y="414" text-anchor="middle">200</text><text class="lc-tick" x="674.5" y="414" text-anchor="middle">500</text><text class="lc-tick" x="737.3" y="414" text-anchor="middle">1000</text><text class="lc-tick" x="800.0" y="414" text-anchor="middle">2000</text>
  <text class="lc-sub" x="455" y="442" text-anchor="middle">训练步数。检查点按顺序等距排列，横向距离不代表步数差</text>
  <text class="lc-sub" x="88" y="118" text-anchor="end">平均损失</text>
</svg>
