<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" role="img" aria-labelledby="lc-title lc-desc">
  <title id="lc-title">同一次训练里，训练损失和验证损失的变化</title>
  <desc id="lc-desc">横轴是十二个检查点，从第 0 步到第 2000 步，按顺序等距排列，横向距离不代表步数差；纵轴是平均损失。在所画的检查点上，训练损失逐个下降，从 1.292 到 0.009。验证损失从 1.304 降到第 500 步的 0.360，之后回升到 0.413。三类平分时的损失是 1.099。</desc>
  <defs>
    <style>
      .lc-title{font:650 20px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .lc-sub{font:14.5px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24485e}
      .lc-tick{font:13.5px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24485e}
      .lc-label{font:650 14px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .lc-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
  <rect width="940" height="460" rx="12" fill="#f4f8fa"/>
  <text class="lc-title" x="30" y="44">同一次训练里，训练损失和验证损失的变化</text>
  <text class="lc-sub" x="30" y="68">起点种子 1，学习率 0.1，共 2000 步；只画出留了记录的 12 个检查点</text>
  <g>
    <path d="M30 96H58" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="44" cy="96" r="4" fill="#2a78d6"/>
    <text class="lc-sub" x="66" y="101">训练损失（10 行）</text>
    <path d="M206 96H234" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><circle cx="220" cy="96" r="4" fill="#eb6834"/>
    <text class="lc-sub" x="242" y="101">验证损失（3 行）</text>
  </g>
  <path d="M96 390.0H806" stroke="#cfdde5" stroke-width="1"/><text class="lc-tick" x="88" y="395.0" text-anchor="end">0</text><path d="M96 295.0H806" stroke="#cfdde5" stroke-width="1"/><text class="lc-tick" x="88" y="300.0" text-anchor="end">0.5</text><path d="M96 200.0H806" stroke="#cfdde5" stroke-width="1"/><text class="lc-tick" x="88" y="205.0" text-anchor="end">1.0</text>
  <path d="M96 181.3H806" stroke="#8fa6b3" stroke-width="1"/>
  <text class="lc-tick" x="814" y="186.3">三类平分 1.099</text>
  <path d="M674.5 124V390" stroke="#8fa6b3" stroke-width="1"/>
  <text class="lc-label" x="666.5" y="136" text-anchor="end">第 500 步：验证损失最低，选这一份</text>
  <path class="lc-line" d="M110.0 144.5L172.7 168.8L235.5 183.1L298.2 205.2L360.9 218.1L423.6 229.0L486.4 256.9L549.1 295.9L611.8 341.2L674.5 377.8L737.3 385.8L800.0 388.4" stroke="#2a78d6"/>
