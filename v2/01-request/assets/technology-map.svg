<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" role="img" aria-labelledby="tech-title tech-desc">
  <title id="tech-title">技术关系</title>
  <desc id="tech-desc">人工智能采用机器学习等方法，深度学习属于机器学习。深度学习可用于构建语言模型，许多大语言模型采用 Transformer 架构。天气查询应用调用语言模型提取参数，查询天气服务取得预报。</desc>
  <defs>
    <marker id="tech-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#426176"/>
    </marker>
    <style>
      .tc-main{font:700 22px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .tc-title{font:650 19px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .tc-text{font:15px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#39566a}
      .tc-link{fill:none;stroke:#426176;stroke-width:2;marker-end:url(#tech-arrow)}
    </style>
  </defs>
  <rect width="1000" height="544" rx="16" fill="#f4f8fa"/>
  <text x="28" y="38" class="tc-main">技术关系</text>

  <g stroke-width="1.5">
    <rect x="28" y="63" width="213" height="84" rx="12" fill="#fff" stroke="#beced7"/>
    <rect x="383" y="63" width="233" height="84" rx="12" fill="#fff" stroke="#beced7"/>
    <rect x="757" y="63" width="215" height="84" rx="12" fill="#fff" stroke="#beced7"/>

    <rect x="28" y="228" width="213" height="84" rx="12" fill="#fff6e8" stroke="#dec19b"/>
