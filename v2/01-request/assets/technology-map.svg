    <rect x="757" y="228" width="215" height="84" rx="12" fill="#f4eef9" stroke="#c5acd8"/>

    <rect x="28" y="356" width="944" height="160" rx="14" fill="#eef7f6" stroke="#a0c5c1"/>
    <rect x="57" y="421" width="255" height="72" rx="12" fill="#fff" stroke="#a0c5c1"/>
    <rect x="371" y="421" width="250" height="72" rx="12" fill="#fff" stroke="#a0c5c1"/>
    <rect x="685" y="421" width="255" height="72" rx="12" fill="#fff" stroke="#a0c5c1"/>
  </g>

  <g text-anchor="middle">
    <text x="134" y="98" class="tc-title">人工智能 AI</text>
    <text x="134" y="126" class="tc-text">领域</text>
    <text x="499" y="98" class="tc-title">机器学习 ML</text>
    <text x="499" y="126" class="tc-text">依据数据学习的方法</text>
    <text x="864" y="98" class="tc-title">深度学习 DL</text>
    <text x="864" y="126" class="tc-text">使用多层神经网络的方法</text>

    <text x="134" y="263" class="tc-title">Transformer</text>
    <text x="134" y="291" class="tc-text">模型架构</text>
    <text x="499" y="263" class="tc-title">大语言模型 LLM</text>
    <text x="499" y="291" class="tc-text">模型类别</text>
    <text x="864" y="263" class="tc-title">生成式 AI</text>
    <text x="864" y="291" class="tc-text">GenAI，生成内容的方向</text>

    <text x="185" y="451" class="tc-title">GPT 模型服务</text>
    <text x="185" y="475" class="tc-text">根据用户原话生成查询参数</text>
    <text x="496" y="451" class="tc-title">天气查询应用</text>
    <text x="496" y="475" class="tc-text">解析参数、查询预报、显示结果</text>
    <text x="812" y="451" class="tc-title">天气服务</text>
    <text x="812" y="475" class="tc-text">提供逐日预报数据</text>
  </g>

  <text x="57" y="394" class="tc-title">天气查询系统</text>
  <text x="207" y="394" class="tc-text">由应用、模型服务和天气服务组成</text>

