    <text x="312" y="265">许多 LLM 采用</text>
    <text x="686" y="265">用于文本生成</text>
    <text x="341" y="329">运行于模型服务中</text>
    <text x="919" y="339">用于参数生成</text>
    <text x="342" y="450">调用</text>
    <text x="653" y="450">查询</text>
