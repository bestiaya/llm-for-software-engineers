<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 353" role="img" aria-labelledby="td-title td-desc">
  <title id="td-title">从检查记录到一个可核对的分类样本</title>
  <desc id="td-desc">在判断时点分别数出 A 和 B 最近三次检查的超时次数，得到一和三。用至少两次的规则生成标签一。模型判断时接收计数，标签交给程序对照输出。</desc>
  <defs>
    <marker id="td-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#426176"/>
    </marker>
    <style>
      .td-major{font:700 22px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .td-head{font:650 18px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#142e40}
      .td-copy{font:15px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#39566a}
      .td-box{stroke-width:1.5}
      .td-link{fill:none;stroke:#426176;stroke-width:2;marker-end:url(#td-arrow)}
    </style>
  </defs>
  <rect width="1040" height="353" rx="16" fill="#f4f8fa"/>
  <text x="28" y="42" class="td-major">从检查记录到一个可核对的样本</text>
  <text x="28" y="68" class="td-copy">在同一判断时点取两路最近三次检查</text>

  <rect x="28" y="127" width="240" height="110" rx="12" fill="#fff" stroke="#beced7" class="td-box"/>
  <rect x="332" y="127" width="184" height="110" rx="12" fill="#eaf1fb" stroke="#a5bce0" class="td-box"/>
  <rect x="585" y="220" width="169" height="105" rx="12" fill="#fff6e8" stroke="#dec19b" class="td-box"/>
  <rect x="816" y="127" width="196" height="110" rx="12" fill="#e6f5f3" stroke="#8fc3bd" class="td-box"/>

  <g text-anchor="middle">
    <text x="148" y="158" class="td-head">检查记录</text>
    <text x="148" y="188" class="td-copy">A　正常、超时、正常</text>
    <text x="148" y="214" class="td-copy">B　超时、超时、超时</text>
    <text x="424" y="158" class="td-head">特征（模型输入）</text>
    <text x="424" y="188" class="td-copy">A 超时 1 次</text>
    <text x="424" y="214" class="td-copy">B 超时 3 次</text>
    <text x="669" y="248" class="td-head">标签（标准答案）</text>
    <text x="669" y="277" class="td-copy">至少两次算达标</text>
    <text x="669" y="302" class="td-copy">只有 B 达标，标签 1</text>
    <text x="914" y="158" class="td-head">一行样本</text>
    <text x="914" y="188" class="td-copy">输入　(1, 3)</text>
    <text x="914" y="214" class="td-copy">标准答案　1</text>
  </g>

  <path class="td-link" d="M268 180H329"/>
  <path class="td-link" d="M516 162H813"/>
  <path class="td-link" d="M424 237V272H582"/>
  <path class="td-link" d="M754 272H914V240"/>
  <g class="td-copy" text-anchor="middle">
    <text x="300" y="113">数次数</text>
    <text x="666" y="148">保存输入</text>
    <text x="502" y="261">按规则标注</text>
    <text x="826" y="291">保存标准答案</text>
  </g>
</svg>
