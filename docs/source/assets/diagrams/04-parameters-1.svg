<svg viewBox="0 0 730 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="token索引到嵌入向量再到候选分数"><rect width="100%" height="100%" fill="white"/>
<rect width="730" height="170" rx="14" fill="#f2f2ff"/><g font-family="sans-serif" font-size="18" fill="#29245c"><text x="20" y="45">ID=1(B)</text><text x="170" y="45">→ 查E</text><text x="300" y="45">h=[0,1]</text><text x="450" y="45">→ 乘U、加b</text><text x="620" y="45">z</text><text x="20" y="105">E：三行，每行两维</text><text x="300" y="105">U：两行三列</text><text x="540" y="105">→ softmax</text><text x="20" y="145">ID选择行；向量参与算术；输出最后一维仍覆盖整个词表。</text></g></svg>
