<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 145" role="img" aria-label="连续文本分为80百分比训练及各10百分比验证和测试"><rect width="100%" height="100%" fill="white"/><g stroke="#193149" stroke-width="2"><rect x="10" y="30" width="560" height="55" fill="none"/><rect x="570" y="30" width="70" height="55" fill="none"/><rect x="640" y="30" width="70" height="55" fill="none"/></g><g fill="#193149" text-anchor="middle" font-size="16"><text x="290" y="64">前80%：训练与拟合词表</text><text x="605" y="64">验证</text><text x="675" y="64">测试</text><text x="360" y="123">每个分区独立切窗口；不把边界两侧拼成一条样本</text></g></svg>
